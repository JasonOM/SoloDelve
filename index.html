<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Solo Delve</title>
<style>
:root{--bg:#eef0f7;--sf:#fff;--tx:#1b1f3a;--mu:#5b6086;--ac:#8a5d00;--acb:#fff;--bd:#cfd3e6;--dg:#a63a32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f3a;--sf:#262b4d;--tx:#e8e6f0;--mu:#a3a8cc;--ac:#e0b04a;--acb:#1b1f3a;--bd:#3a4070;--dg:#e07a70}}
:root[data-theme="dark"]{--bg:#1b1f3a;--sf:#262b4d;--tx:#e8e6f0;--mu:#a3a8cc;--ac:#e0b04a;--acb:#1b1f3a;--bd:#3a4070;--dg:#e07a70}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Georgia,'Iowan Old Style',serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:14px 14px 20px;-webkit-overflow-scrolling:touch}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:15px;margin:16px 0 6px;color:var(--mu);font-weight:normal}
nav{display:flex;border-top:1px solid var(--bd);background:var(--sf);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:13px 0;font:inherit;font-size:14px}
nav button.on{color:var(--ac);font-weight:bold;box-shadow:inset 0 3px 0 var(--ac)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button.b,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px 8px;min-height:46px}
button.b{cursor:pointer}
button.b:active{background:var(--ac);color:var(--acb)}
button.p{background:var(--ac);color:var(--acb);border-color:var(--ac);font-weight:bold}
input,textarea,select{width:100%}
textarea{min-height:120px;font:13px/1.4 ui-monospace,Menlo,monospace}
.res{background:var(--sf);border-left:4px solid var(--ac);border-radius:6px;padding:12px;margin:12px 0;min-height:56px}
.res b{font-size:26px}
.e{padding:9px 0;border-bottom:1px solid var(--bd)}
.e small{color:var(--mu);display:block}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row>*{flex:1}
.row .s{flex:0 0 auto}
.x{color:var(--dg)}
.cl{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.cl i{width:34px;height:34px;border:2px solid var(--ac);border-radius:50%;display:inline-block}
.cl i.f{background:var(--ac)}
.hint{color:var(--mu);font-size:14px}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1b1f3a">
<meta name="apple-mobile-web-app-title" content="Solo Delve">
</head>
<body>
<main id="m"></main>
<nav id="n"></nav>
<script>
const DEF_TABLES={
"Discovery":{entries:["A collapsed stair leading down","Signs of a recent camp","A sealed door with fresh scratches","A shrine, long unattended","Tracks that end abruptly","A locked chest. The key is nearby. [[Danger]]"]},
"Danger":{entries:["A trap triggers underfoot","Something is watching you","The way back is blocked","A rival party arrives","Supplies are spoiled or lost","A sudden collapse"]},
"Weather":{die:100,entries:[{r:[1,30],t:"Clear"},{r:[31,70],t:"Overcast"},{r:[71,90],t:"Rain"},{r:[91,100],t:"Storm"}]}
};
let S={journal:[],tables:DEF_TABLES,sheet:{name:"",hp:10,max:10,stats:{Might:0,Wits:0,Grit:0},clocks:[]}};
const KEY="solo-delve-v1";
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(S,o)}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const d=n=>1+Math.floor(Math.random()*n);
function log(t,k){S.journal.unshift({t,k:k||"",ts:new Date().toLocaleString([], {dateStyle:"short",timeStyle:"short"})});save()}
function rollTable(name,depth){
 depth=depth||0;const T=S.tables[name];if(!T)return "(no table: "+name+")";
 const es=T.entries,n=T.die||es.length;const r=d(n);let t;
 if(typeof es[0]==="object"){const hit=es.find(e=>r>=e.r[0]&&r<=e.r[1]);t=hit?hit.t:"(gap at "+r+")"}else t=es[r-1];
 if(depth<3)t=t.replace(/\[\[(.+?)\]\]/g,(_,x)=>"→ "+x+": "+rollTable(x.trim(),depth+1));
 return t}
const el=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild};
let tab="roll",last=null;
const tabs=[["roll","Dice"],["oracle","Oracle"],["tables","Tables"],["journal","Journal"],["sheet","Sheet"]];
function nav(){const n=document.getElementById("n");n.innerHTML="";tabs.forEach(([k,l])=>{const b=el(`<button class="${k===tab?"on":""}">${l}</button>`);b.onclick=()=>{tab=k;last=null;render()};n.append(b)})}
function render(){nav();const m=document.getElementById("m");m.innerHTML="";m.scrollTop=0;({roll:vRoll,oracle:vOracle,tables:vTables,journal:vJournal,sheet:vSheet})[tab](m)}
function show(m,html){let r=m.querySelector(".res");r.innerHTML=html}
function vRoll(m){
 m.append(el(`<div><h2>Dice</h2><div class="g" id="g"></div><div class="res" id="r"><span class="hint">Tap a die.</span></div><div class="row"><button class="b" id="two">Roll 2d6</button><button class="b" id="adv">d20 ×2 (keep high)</button></div></div>`));
 const g=m.querySelector("#g"),r=m.querySelector("#r");
 [4,6,8,10,12,20,100].forEach(n=>{const b=el(`<button class="b">d${n}</button>`);b.onclick=()=>{const v=d(n);r.innerHTML=`<b>${v}</b> <span class="hint">d${n}</span>`;log(`d${n} → ${v}`,"dice")};g.append(b)});
 m.querySelector("#two").onclick=()=>{const a=d(6),b=d(6);r.innerHTML=`<b>${a+b}</b> <span class="hint">2d6 (${a}+${b})</span>`;log(`2d6 → ${a+b} (${a}+${b})`,"dice")};
 m.querySelector("#adv").onclick=()=>{const a=d(20),b=d(20);r.innerHTML=`<b>${Math.max(a,b)}</b> <span class="hint">d20 (${a}, ${b})</span>`;log(`d20 adv → ${Math.max(a,b)} (${a}, ${b})`,"dice")}}
function vOracle(m){
 m.append(el(`<div><h2>Oracle</h2><select id="o"><option value="25">Unlikely</option><option value="50" selected>Even odds</option><option value="75">Likely</option></select><div class="row"><input id="q" placeholder="Question (optional)"></div><button class="b p" id="go" style="width:100%">Ask</button><div class="res"><span class="hint">Roll d100 at or under the odds for Yes. Doubles add a twist.</span></div></div>`));
 m.querySelector("#go").onclick=()=>{const th=+m.querySelector("#o").value,v=d(100),dbl=v%11===0,yes=v<=th;
  const a=(yes?"Yes":"No")+(dbl?", and something changes":"");const q=m.querySelector("#q").value.trim();
  show(m,`<b>${a}</b> <span class="hint">d100 ${v} vs ${th}</span>`);log((q?q+" ":"")+`→ ${a} (${v}/${th})`,"oracle")}}
function vTables(m){
 m.append(el(`<div><h2>Tables</h2><div id="tl"></div><div class="res"><span class="hint">Pick a table to roll. [[Name]] inside an entry chains to another table.</span></div><h3>Your tables (JSON)</h3><textarea id="j" spellcheck="false"></textarea><div class="row"><button class="b" id="ap">Apply</button><button class="b" id="rs">Reset to samples</button></div><p class="hint">Format: {"Name":{"die":100,"entries":[{"r":[1,20],"t":"text"}]}} or {"Name":{"entries":["a","b"]}}</p></div>`));
 const tl=m.querySelector("#tl"),ta=m.querySelector("#j");ta.value=JSON.stringify(S.tables,null,1);
 const g=el(`<div class="g" style="grid-template-columns:1fr 1fr"></div>`);
 Object.keys(S.tables).forEach(k=>{const b=el(`<button class="b"></button>`);b.textContent=k;b.onclick=()=>{const t=rollTable(k);const r=m.querySelector(".res");r.textContent="";const bb=document.createElement("b");bb.style.fontSize="18px";bb.textContent=t;r.append(bb);log(k+": "+t,"table")};g.append(b)});tl.append(g);
 m.querySelector("#ap").onclick=()=>{try{const o=JSON.parse(ta.value);S.tables=o;save();render()}catch(e){alert("That JSON isn't valid: "+e.message)}};
 m.querySelector("#rs").onclick=()=>{if(confirm("Replace your tables with the samples?")){S.tables=DEF_TABLES;save();render()}}}
function vJournal(m){
 m.append(el(`<div><h2>Journal</h2><div class="row"><input id="n" placeholder="Add a note"><button class="b s" id="ad">Add</button></div><div id="l"></div><h3>Backup</h3><div class="row"><button class="b" id="ex">Copy save</button><button class="b" id="im">Load save</button></div></div>`));
 const add=()=>{const i=m.querySelector("#n"),v=i.value.trim();if(v){log(v,"note");render()}};
 m.querySelector("#ad").onclick=add;
 const l=m.querySelector("#l");
 if(!S.journal.length)l.append(el(`<p class="hint">Rolls land here automatically.</p>`));
 S.journal.slice(0,100).forEach((e,i)=>{const x=el(`<div class="e"><span></span><small></small></div>`);x.firstChild.textContent=e.t;x.lastChild.textContent=e.ts+" · "+e.k;x.onclick=()=>{if(confirm("Delete this entry?")){S.journal.splice(i,1);save();render()}};l.append(x)});
 m.querySelector("#ex").onclick=async()=>{const s=JSON.stringify(S);try{await navigator.clipboard.writeText(s);alert("Save copied. Paste it into Notes to keep a backup.")}catch(e){prompt("Copy this save:",s)}};
 m.querySelector("#im").onclick=()=>{const s=prompt("Paste your save:");if(!s)return;try{S=Object.assign(S,JSON.parse(s));save();render()}catch(e){alert("Couldn't read that save.")}}}
function vSheet(m){
 const h=S.sheet;
 m.append(el(`<div><h2>Character</h2><input id="nm" placeholder="Name"><h3>Health</h3><div class="row"><button class="b s" id="hm">−</button><div class="res" style="margin:0;text-align:center"><b id="hp"></b></div><button class="b s" id="hpl">+</button></div><h3>Stats</h3><div id="st"></div><h3>Clocks</h3><div id="ck"></div><div class="row"><input id="cn" placeholder="New clock name"><input id="cs" type="number" value="6" min="2" max="12" style="flex:0 0 70px"><button class="b s" id="cadd">Add</button></div></div>`));
 const nm=m.querySelector("#nm");nm.value=h.name;nm.onchange=()=>{h.name=nm.value;save()};
 const hp=m.querySelector("#hp"),sh=()=>hp.textContent=h.hp+" / "+h.max;sh();
 m.querySelector("#hm").onclick=()=>{h.hp=Math.max(0,h.hp-1);save();sh()};
 m.querySelector("#hpl").onclick=()=>{h.hp=Math.min(h.max,h.hp+1);save();sh()};
 const st=m.querySelector("#st");
 Object.keys(h.stats).forEach(k=>{const r=el(`<div class="row"><span></span><button class="b s">−</button><b class="s" style="min-width:28px;text-align:center"></b><button class="b s">+</button></div>`);const[sp,mi,v,pl]=r.children;sp.textContent=k;v.textContent=h.stats[k];mi.onclick=()=>{h.stats[k]--;save();v.textContent=h.stats[k]};pl.onclick=()=>{h.stats[k]++;save();v.textContent=h.stats[k]};st.append(r)});
 const ck=m.querySelector("#ck");
 h.clocks.forEach((c,i)=>{const w=el(`<div><div class="row"><span></span><button class="b s x">Delete</button></div><div class="cl"></div></div>`);w.querySelector("span").textContent=c.n+" ("+c.f+"/"+c.s+")";
  w.querySelector("button").onclick=()=>{h.clocks.splice(i,1);save();render()};
  const box=w.querySelector(".cl");for(let j=0;j<c.s;j++){const s=el(`<i class="${j<c.f?"f":""}"></i>`);s.onclick=()=>{c.f=(c.f===j+1)?j:j+1;save();if(c.f===c.s)log("Clock full: "+c.n,"clock");render()};box.append(s)}ck.append(w)});
 m.querySelector("#cadd").onclick=()=>{const n=m.querySelector("#cn").value.trim(),s=Math.min(12,Math.max(2,+m.querySelector("#cs").value||6));if(n){h.clocks.push({n,s,f:0});save();render()}}}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
load();render();
</script>
</body>
</html>
